name: python2 

on: 
  push:
    branches:
    - main

jobs:
  checkout:
    runs-on: ubuntu-latest

    steps: 
    - name: GitCheckout
      uses: actions/checkout@v4
    
    - name: set up docker 
      uses: docker/setup-buildx-action@v3

    - name: Docker_login
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Docker build
      run: |
        docker buildx build --tag ckdh0799/gha:latest -f Dockerfile . \
          --push

  Deploy:
    runs-on: ubuntu-latest
    needs: checkout

    steps:
    - uses: actions/checkout@v4
    - name: Build & Deploy
      uses: webfactory/ssh-agent@v0.9.0 
      with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: ssh_login
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@13.233.28.74 

          docker stop python || true 
          docker rm python || true 
          docker run --name python -itdp 800:7000 ckdh0799/gha:latest 
